data:
  raw_dir: data/raw
  processed_dir: data/processed
  sample_rate: 16000      # AST expects 16 kHz
  clip_seconds: 5.0
  val_split: 0.15
  test_split: 0.15

model:
  # HuggingFace AST checkpoint pretrained on AudioSet (recognizes many
  # animal/bird sounds out of the box — ideal for transfer learning).
  pretrained: MIT/ast-finetuned-audioset-10-10-0.4593
  freeze_backbone: true   # set false to fine-tune the whole transformer
  dropout: 0.2

train:
  batch_size: 8           # AST is memory-heavy; lower than the CNN baseline
  epochs: 15
  lr: 3.0e-4              # head-only; drop to 1e-5 if unfreezing backbone
  weight_decay: 1.0e-4
  num_workers: 2
  checkpoint_dir: models
  seed: 42
