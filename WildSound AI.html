/* ─── WAVEFORM ─── */
function Waveform({ playing, color = "#22c55e", barCount = 64 }) {
  const [bars] = useState(() =>
  Array.from({ length: barCount }, () => 0.2 + Math.random() * 0.8)
  );
  const [progress, setProgress] = useState(0.38);
  const raf = useRef();
  const startRef = useRef(null);

  useEffect(() => {
    if (playing) {
      const step = (ts) => {
        if (!startRef.current) startRef.current = ts;
        const elapsed = (ts - startRef.current) / 8000;
        setProgress((p) => {
          const next = p + 0.002;
          return next > 1 ? 0 : next;
        });
        raf.current = requestAnimationFrame(step);
      };
      raf.current = requestAnimationFrame(step);
    } else {
      cancelAnimationFrame(raf.current);
      startRef.current = null;
    }
    return () => cancelAnimationFrame(raf.current);
  }, [playing]);

  return (
    <div style={{ display: "flex", alignItems: "center", gap: 2, height: 48, padding: "0 4px" }}>
      {bars.map((h, i) => {
        const past = i / barCount < progress;
        return (
          <div
            key={i}
            style={{
              flex: 1,
              height: `${h * 100}%`,
              borderRadius: 2,
              background: past ? color : "#d1fae5",
              transition: "background 0.1s"
            }} />);


      })}
    </div>);

}

/* ─── CONFIDENCE BAR ─── */
function ConfidenceBar({ pct, color = "#22c55e", tweaks }) {
  const [animated, setAnimated] = useState(0);
  useEffect(() => {
    const t = setTimeout(() => setAnimated(pct), 300);
    return () => clearTimeout(t);
  }, [pct]);
  return (
    <div style={{ flex: 1, height: 6, background: "#e2ede7", borderRadius: 3 }}>
      <div style={{
        height: "100%", width: `${animated}%`, borderRadius: 3,
        background: `linear-gradient(90deg, ${color}99, ${color})`,
        transition: "width 0.8s cubic-bezier(.4,0,.2,1)"
      }} />
    </div>);

}

/* ─── RECORD BUTTON ─── */
function RecordButton({ tweaks }) {
  const [recording, setRecording] = useState(false);
  const [seconds, setSeconds] = useState(0);
  const timerRef = useRef();

  useEffect(() => {
    if (recording) {
      timerRef.current = setInterval(() => setSeconds((s) => s + 1), 1000);
    } else {
      clearInterval(timerRef.current);
      setSeconds(0);
    }
    return () => clearInterval(timerRef.current);
  }, [recording]);

  const fmt = (s) => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;

  return (
    <button
      onClick={() => setRecording((r) => !r)}
      style={{
        display: "flex", alignItems: "center", justifyContent: "center", gap: 10,
        width: "100%", padding: "12px",
        background: recording ? "#fef2f2" : "#f0fdf4",
        border: `1.5px solid ${recording ? "#fca5a5" : "#bbf7d0"}`,
        borderRadius: tweaks.roundness - 4,
        cursor: "pointer", fontFamily: "DM Sans",
        transition: "all 0.2s"
      }}>
      
      <div style={{
        width: 32, height: 32, borderRadius: "50%",
        background: recording ? "#ef4444" : "#f0fdf4",
        border: `2px solid ${recording ? "#ef4444" : "#bbf7d0"}`,
        display: "flex", alignItems: "center", justifyContent: "center",
        position: "relative",
        boxShadow: recording ? "0 0 0 4px #fca5a533, 0 0 0 8px #ef444422" : "none",
        transition: "all 0.3s"
      }}>
        {recording ?
        <div style={{ width: 10, height: 10, background: "#fff", borderRadius: 2 }} /> :

        <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
            <rect x="9" y="2" width="6" height="13" rx="3" fill="#22c55e" />
            <path d="M5 10a7 7 0 0014 0M12 21v-4M8 21h8" stroke="#22c55e" strokeWidth="2" strokeLinecap="round" />
          </svg>
        }
      </div>
      <span style={{ fontSize: 14, fontWeight: 600, color: recording ? "#ef4444" : "#1a2e22" }}>
        {recording ? `Recording… ${fmt(seconds)}` : "Record Live Audio"}
      </span>
      {recording &&
      <div style={{ display: "flex", gap: 2, alignItems: "center" }}>
          {[1, 0.6, 0.9, 0.4, 0.7].map((h, i) =>
        <div key={i} style={{
          width: 3, height: `${h * 16}px`, background: "#ef4444",
          borderRadius: 2,
          animation: "pulse-bar 0.6s ease-in-out infinite alternate",
          animationDelay: `${i * 0.12}s`
        }} />
        )}
        </div>
      }
    </button>);

}

        <TweakText label="Top Animal Name" value={tweaks.topAnimal} onChange={(v) => setTweak("topAnimal", v)} />
        <TweakText label="Species (Latin)" value={tweaks.topSpecies} onChange={(v) => setTweak("topSpecies", v)} />
        <TweakSection label="Layout" />
        <TweakSlider label="Corner Radius" value={tweaks.roundness} min={4} max={28} step={2} onChange={(v) => setTweak("roundness", v)} />
      </TweaksPanel>
    </div>);

}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<div id="root"></div>
</body>
</html>
